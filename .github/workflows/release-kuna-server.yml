name: Release kuna-server

on:
  push:
    tags:
      - 'kuna-server-v*'

permissions:
  contents: write

jobs:
  # Builds the Kuna engine for linux/amd64 together with the compiled SLEIGH specs
  # that every other platform reuses (spec compilation is platform independent).
  kuna-linux-amd64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Verify tag matches VERSION file
      run: |
        TAG_VERSION="${GITHUB_REF_NAME##*-v}"
        FILE_VERSION="$(tr -d '[:space:]' < modules/decx-kuna/VERSION)"
        echo "tag version: $TAG_VERSION"
        echo "VERSION file: $FILE_VERSION"
        if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
          echo "::error::Tag '${GITHUB_REF_NAME}' does not match modules/decx-kuna/VERSION '${FILE_VERSION}'. Update the VERSION file and re-tag."
          exit 1
        fi

    - uses: dtolnay/rust-toolchain@stable

    - name: Build kuna-server (linux/amd64)
      run: ./build.sh
      working-directory: modules/decx-kuna

    - name: Upload linux/amd64 archive
      uses: actions/upload-artifact@v4
      with:
        name: kuna-server-linux-amd64
        path: modules/decx-kuna/dist/kuna-server-*.zip
        if-no-files-found: error
        retention-days: 1

    - name: Upload compiled SLEIGH specs
      uses: actions/upload-artifact@v4
      with:
        name: kuna-specs
        path: modules/decx-kuna/.build/specs
        if-no-files-found: error
        retention-days: 1

  # Builds the remaining published platforms from the pre-compiled specs.
  kuna-other-platforms:
    needs: kuna-linux-amd64
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-14
          os: darwin
          arch: arm64
        - runner: macos-13
          os: darwin
          arch: amd64
        - runner: ubuntu-24.04-arm
          os: linux
          arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - uses: dtolnay/rust-toolchain@stable

    - name: Restore compiled SLEIGH specs
      uses: actions/download-artifact@v4
      with:
        name: kuna-specs
        path: modules/decx-kuna/.build/specs

    - name: Build kuna-server (${{ matrix.os }}/${{ matrix.arch }})
      run: SKIP_SPECS=1 OUT_OS=${{ matrix.os }} OUT_ARCH=${{ matrix.arch }} ./build.sh
      working-directory: modules/decx-kuna

    - name: Upload archive
      uses: actions/upload-artifact@v4
      with:
        name: kuna-server-${{ matrix.os }}-${{ matrix.arch }}
        path: modules/decx-kuna/dist/kuna-server-*.zip
        if-no-files-found: error
        retention-days: 1

  release:
    needs: kuna-other-platforms
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Verify tag matches VERSION file
      run: |
        TAG_VERSION="${GITHUB_REF_NAME##*-v}"
        FILE_VERSION="$(tr -d '[:space:]' < modules/decx-kuna/VERSION)"
        echo "tag version: $TAG_VERSION"
        echo "VERSION file: $FILE_VERSION"
        if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
          echo "::error::Tag '${GITHUB_REF_NAME}' does not match modules/decx-kuna/VERSION '${FILE_VERSION}'. Update the VERSION file and re-tag."
          exit 1
        fi

    - name: Set version
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME##*-v}"
        echo "value=$VERSION" >> $GITHUB_OUTPUT
        # Versions with a prerelease suffix (e.g. 0.2.0-beta.1) publish as GitHub prereleases.
        case "$VERSION" in
          *-*) echo "prerelease=true" >> $GITHUB_OUTPUT ;;
          *)   echo "prerelease=false" >> $GITHUB_OUTPUT ;;
        esac

    - name: Collect kuna-server archives
      uses: actions/download-artifact@v4
      with:
        pattern: kuna-server-*
        merge-multiple: true
        path: dist/kuna-server

    - name: Verify release artifacts
      run: |
        VERSION="${{ steps.version.outputs.value }}"
        ls -la dist/kuna-server/
        test -f "dist/kuna-server/kuna-server-$VERSION-darwin-amd64.zip"
        test -f "dist/kuna-server/kuna-server-$VERSION-darwin-arm64.zip"
        test -f "dist/kuna-server/kuna-server-$VERSION-linux-amd64.zip"
        test -f "dist/kuna-server/kuna-server-$VERSION-linux-arm64.zip"
        for zip in dist/kuna-server/kuna-server-*.zip; do
          unzip -Z1 "$zip" | grep -qx 'decx.json'
          unzip -Z1 "$zip" | grep -qx 'VERSION'
        done

    - name: Generate checksums
      run: |
        cd dist/kuna-server
        rm -f SHA256SUMS
        sha256sum *.zip > SHA256SUMS
        cat SHA256SUMS

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: |
          dist/kuna-server/kuna-server-*.zip
          dist/kuna-server/SHA256SUMS
        draft: false
        prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
