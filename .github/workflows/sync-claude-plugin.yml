name: Sync Claude Plugin Version

on:
  push:
    branches: [ main ]
    paths:
      - 'version'
      - 'VERSION'
      - '.claude-plugin/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-plugin-version-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Sync plugin version with repository version
      run: node .github/scripts/sync-plugin-version.mjs

    - name: Commit changes
      run: |
        if git diff --quiet; then
          echo "Claude plugin version already in sync"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .claude-plugin
        git commit -m "chore(plugin): sync Claude plugin version to $(cat version)"
        git push
