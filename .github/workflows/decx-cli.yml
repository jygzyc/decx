name: decx CLI

on:
  push:
    branches: ['**']
    tags: ['decx-v*']
    paths: ['decx/**', 'third_party/tools.json', 'third_party/decx-tool.schema.json', 'LICENSE', '.github/workflows/decx-cli.yml']
  pull_request:
    paths: ['decx/**', 'third_party/tools.json', 'third_party/decx-tool.schema.json', 'LICENSE', '.github/workflows/decx-cli.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Publish this decx-v<version> tag; leave empty for checks only
        required: false

permissions:
  contents: read

concurrency:
  group: decx-cli-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.tag) }}

jobs:
  manager:
    name: npm CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: decx/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
        working-directory: decx
      - run: npm run typecheck
        working-directory: decx
      # Tests build the shipped bundle and exercise real installs, rollback,
      # npm pack, an offline npm prefix install, its public shim and uninstall.
      - run: npm test
        working-directory: decx
      - name: Source entry point JSON envelope
        working-directory: decx
        shell: bash
        run: |
          node src/cli.ts version | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(raw);
              if (result.ok !== true || typeof result.version !== "string") process.exit(1);
            });
          '

  publish:
    name: publish npm package
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/decx-v')) || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    needs: manager
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - name: Check tag and trusted-publishing npm version
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { execFileSync } from "node:child_process";
            const pkg = JSON.parse(fs.readFileSync("decx/package.json", "utf8"));
            const expected = `decx-v${pkg.version}`;
            if (process.env.REQUESTED_TAG !== expected) throw new Error(`expected tag ${expected}`);
            const [major, minor, patch] = execFileSync("npm", ["--version"], {encoding: "utf8"}).trim().split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("trusted publishing requires npm >=11.5.1");
          '
      - run: npm ci --no-audit --no-fund
        working-directory: decx
      # Configure this repository/workflow as the package's trusted publisher
      # on npmjs.com before tagging. No long-lived npm token or native SDK.
      - run: npm publish --access public --provenance
        working-directory: decx
