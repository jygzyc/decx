name: Decx knowledge
on:
  push:
    branches: ['**']
    paths: ['.pi/extensions/decx/**', 'skills/check-skills.py', '.github/workflows/decx-knowledge.yml']
  pull_request:
    paths: ['.pi/extensions/decx/**', 'skills/check-skills.py', '.github/workflows/decx-knowledge.yml']
  schedule:
    - cron: '19 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: node --test .pi/extensions/decx/lib.test.ts
      - shell: bash
        run: |
          project=$(mktemp -d)
          trap 'rm -rf "$project"' EXIT
          node .pi/extensions/decx/cli.ts init --root "$project"
          node .pi/extensions/decx/cli.ts check --root "$project"
      - run: python skills/check-skills.py
