# Purpose: publish the prebuilt AFE release assets `decx install afe` prefers.
name: release-afe

# `decx install afe` prefers a prebuilt release asset and only falls back to
# `cargo build` when none matches the platform, so this workflow is what makes a
# toolchain-free install possible. The names are part of that contract: the
# manifest (subprojects/decx-afe/decx-afe.json) looks for
# `afe-{version}-<platform>.tar.gz|zip` plus `afe-SHA256SUMS.txt` under a
# `tools-v*` tag, where `{version}` is the tag without its prefix. Rename an
# asset here and installs silently degrade to a local Rust build (or fail on a
# machine without Rust), which is why the tag and the crate version have to
# agree before anything is built.
on:
  push:
    tags: ['tools-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. tools-v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-afe-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: tag
        run: |
          set -eu
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          case "$tag" in
            tools-v*) version="${tag#tools-v}" ;;
            *) echo "::error::tag '$tag' must look like tools-v<version>"; exit 1 ;;
          esac
          # No empty or v-prefixed version: the asset names embed it verbatim.
          case "$version" in
            ''|v*|*[!0-9.]*)
              echo "::error::tag version '$version' must be numeric like 0.1.0"
              exit 1 ;;
          esac
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' subprojects/decx-afe/Cargo.toml | head -1)"
          if [ "$crate" != "$version" ]; then
            echo "::error::tag version '$version' does not match the afe crate version '$crate'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every platform the afe manifest declares. macOS builds both slices
          # on the arm64 image instead of trusting a second runner label, and
          # Windows on ARM builds natively on windows-11-arm.
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - platform: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - platform: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subprojects/decx-afe
          key: ${{ matrix.target }}
      - name: Build ${{ matrix.target }}
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path subprojects/decx-afe/Cargo.toml
      # Cross-compiled slices (macos-x64 on the arm64 runner) cannot execute;
      # only smoke the binary the runner can natively run.
      - name: Smoke the release binary
        if: matrix.platform != 'macos-x64'
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          "subprojects/decx-afe/target/${{ matrix.target }}/release/afe$ext" --version
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          name="afe-${{ needs.validate.outputs.version }}-${{ matrix.platform }}"
          mkdir -p dist
          cp "subprojects/decx-afe/target/${{ matrix.target }}/release/afe" dist/afe
          tar -czf "$name.tar.gz" -C dist afe
          ls -l "$name.tar.gz"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "afe-${{ needs.validate.outputs.version }}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "subprojects/decx-afe/target/${{ matrix.target }}/release/afe.exe" dist/afe.exe
          Compress-Archive -Path dist/afe.exe -DestinationPath "$name.zip" -Force
          Get-Item "$name.zip" | Format-List Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: afe-${{ matrix.platform }}
          path: afe-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.validate.outputs.tag }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify the asset set and write checksums
        working-directory: dist
        run: |
          set -eu
          version="${{ needs.validate.outputs.version }}"
          for platform in linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64 windows-arm64; do
            ls "afe-$version-$platform".* > /dev/null
          done
          : > afe-SHA256SUMS.txt
          for asset in afe-*.tar.gz afe-*.zip; do
            sha256sum "$asset" >> afe-SHA256SUMS.txt
          done
          cat afe-SHA256SUMS.txt
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber ./*
          else
            gh release create "$TAG" --title "$TAG" --notes "AFE ${{ needs.validate.outputs.version }}: Android framework extraction binaries for the six platforms the afe manifest declares." ./*
          fi
