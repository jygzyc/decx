name: release-cli

on:
  push:
    tags:
      - 'decx-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    name: build and pack the CLI
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: validate the tag matches decx/package.json
        id: check
        run: |
          node decx/scripts/check-release.mjs "${GITHUB_REF_NAME}"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: build, pack and smoke the CLI
        working-directory: decx
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run pack
          npm run smoke
      - uses: actions/upload-artifact@v7
        with:
          name: decx-cli
          path: decx/artifacts/
          retention-days: 7

  smoke:
    name: smoke the packed CLI (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: decx-cli
          path: artifacts
      - name: unpack and smoke from a non-repo directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke && tar -xzf artifacts/decx-*.tar.gz -C smoke
          cd smoke/decx-*
          node decx/lib/cli.js version
          node decx/lib/cli.js help
          node decx/lib/cli.js install 2>&1 | grep -q '"code":"USAGE"'

  release:
    name: publish the GitHub release
    needs: [pack, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: decx-cli
          path: artifacts
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.pack.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* \
              --title "decx CLI ${tag#decx-v}" \
              --notes "DECX toolkit manager ${tag#decx-v}. The tarball is a self-contained Node 22.18+ CLI: unpack and run \`node decx/lib/cli.js install <tool>\`."
          fi
