name: Kuna

# The manager downloads official upstream release assets directly. CI checks the
# pinned checkout and exercises the real installation path; it does not mirror
# or rebuild upstream binaries.
on:
  push:
    branches: ['**']
    paths: ['third_party/decx-kuna/**', 'decx/**', 'skills/decx-tool/**', '.github/workflows/decx-kuna.yml']
  pull_request:
    paths: ['third_party/decx-kuna/**', 'decx/**', 'skills/decx-tool/**', '.github/workflows/decx-kuna.yml']
  schedule:
    - cron: '0 */12 * * *'
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The scheduled sync's push must not cancel its own run.
  group: kuna-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Pinned checkout contract
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 4 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: The pin is initialised and clean
        run: |
          status=$(git submodule status third_party/decx-kuna/source)
          echo "$status"
          case "$status" in
            ' '*) ;;
            *) echo "submodule is not at the committed revision" >&2; exit 1 ;;
          esac
      - name: The checkout still looks like Kuna
        run: |
          test -f third_party/decx-kuna/source/decompiler/Cargo.toml
          test -d third_party/decx-kuna/source/specs/Ghidra
          cat third_party/decx-kuna/source/VERSION
      - name: The Kuna reference is upstream's copy
        run: |
          awk 'NR==1 && $0=="---" {skip=1; next} skip && $0=="---" {skip=0; next} !skip' \
            third_party/decx-kuna/source/skills/kuna/SKILL.md > "$RUNNER_TEMP/kuna-ref.md"
          diff -u "$RUNNER_TEMP/kuna-ref.md" skills/decx-tool/references/kuna.md
      - name: The manifest covers every supported platform
        run: |
          node -e '
            const manifest = require("./third_party/decx-kuna/decx-kuna.json");
            const keys = ["linux-amd64", "linux-arm64", "darwin-amd64", "darwin-arm64", "win-amd64"];
            const { repository, tagPrefix, assets, checksums } = manifest.release;
            if (repository !== "Noelo-Lab/kuna" || tagPrefix !== "v") {
              throw new Error("Kuna must install from the official v* release tags");
            }
            for (const key of keys) {
              const name = assets[key];
              if (typeof name !== "string" || name.length === 0) {
                throw new Error("release.assets is missing " + key);
              }
              if (name.replaceAll("{version}", "0.0").includes("{")) {
                throw new Error(key + " has an unresolved placeholder: " + name);
              }
              console.log(key.padEnd(12) + name);
            }
            if (checksums !== null) {
              throw new Error("official Kuna assets use GitHub REST SHA-256 digests");
            }
            if (manifest.env?.KUNA_SPECS !== "{prefix}/specs") {
              throw new Error("env.KUNA_SPECS must point the launcher at the specs tree");
            }
            console.log("launch:", manifest.launch, "| bins:", manifest.launch.commands.join(", "));
          '

  release-install:
    name: Release install (${{ matrix.os }})
    # Exercise real installation and decompilation on changes and weekly.
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 4 * * 1' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install the upstream release with the manager
        env:
          DECX_HOME: ${{ runner.temp }}/decx-home
          GH_TOKEN: ${{ github.token }}
        run: node decx/src/cli.ts install kuna --home "$DECX_HOME" --no-links --pretty
      - name: Set up the Windows C compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
      - name: Build the manager
        run: npm ci --prefix decx && npm --prefix decx run build
      - name: Decompile a real executable, recompile recovered C and compare behavior
        env:
          DECX_HOME: ${{ runner.temp }}/decx-home
        run: npm --prefix decx run test:functional:kuna
      - name: The specs archive was unpacked
        env:
          DECX_HOME: ${{ runner.temp }}/decx-home
        run: |
          specs=$(find "$DECX_HOME/share/kuna/specs" -name '*.sla' | wc -l | tr -d ' ')
          echo "$specs compiled .sla files"
          test "$specs" -gt 0
          launcher="$DECX_HOME/bin/kuna"
          [ -f "$launcher" ] || launcher="$DECX_HOME/bin/kuna.cmd"
          ls -l "$launcher"
          grep -q 'KUNA_SPECS' "$launcher"
      - name: PROVENANCE records the release
        env:
          DECX_HOME: ${{ runner.temp }}/decx-home
          GH_TOKEN: ${{ github.token }}
        run: |
          cat "$DECX_HOME/share/kuna/PROVENANCE"
          tag="$(gh api repos/Noelo-Lab/kuna/releases/latest --jq .tag_name)"
          echo "official Kuna release: $tag"
          grep -qx "release_tag: $tag" "$DECX_HOME/share/kuna/PROVENANCE"

  sync-pin:
    name: Sync the pin to upstream's latest
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 */12 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Compare the pin with upstream's latest release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git -C third_party/decx-kuna/source fetch --tags --force origin
          pinned="$(bash .github/scripts/pinned-gitlink.sh third_party/decx-kuna/source)"
          pinned_tag="$(git -C third_party/decx-kuna/source describe --tags --exact-match "$pinned")"
          latest_tag="$(gh api repos/Noelo-Lab/kuna/releases/latest --jq .tag_name)"
          echo "pinned: $pinned_tag ($pinned)"
          echo "upstream latest: $latest_tag"
          for t in "$pinned_tag" "$latest_tag"; do
            version="${t#v}"
            case "$version" in
              ''|*.*.*|*[!0-9.]*) echo "::error::tag '$t' does not look like v<major.minor>"; exit 1 ;;
            esac
          done
          if [ "$latest_tag" = "$pinned_tag" ] || \
             [ "$(printf '%s\n%s\n' "$pinned_tag" "$latest_tag" | sort -V | tail -n1)" != "$latest_tag" ]; then
            echo "upstream has nothing newer than the pin; pushing nothing"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_version="${latest_tag#v}"
          names="$(gh api repos/Noelo-Lab/kuna/releases/latest --jq '.assets[].name')"
          for suffix in linux-x86_64.tar.gz linux-arm64.tar.gz macos-x86_64.tar.gz macos-arm64.tar.gz windows-x86_64.zip specs.tar.gz; do
            if ! grep -qx "kuna-v$latest_version-$suffix" <<<"$names"; then
              echo "::error::upstream $latest_tag is missing the asset kuna-v$latest_version-$suffix; leaving the pin alone"
              exit 1
            fi
          done
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Move the pin and push the commit
        if: ${{ steps.upstream.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -eu
          git -C third_party/decx-kuna/source checkout --detach "$UPSTREAM_TAG"
          awk 'NR==1 && $0=="---" {skip=1; next} skip && $0=="---" {skip=0; next} !skip' \
            third_party/decx-kuna/source/skills/kuna/SKILL.md > skills/decx-tool/references/kuna.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/decx-kuna/source skills/decx-tool/references/kuna.md
          git commit -m "pin kuna to $UPSTREAM_TAG"
          branch="${{ github.event.repository.default_branch }}"
          git push origin "HEAD:refs/heads/$branch"
          # GITHUB_TOKEN pushes do not start workflows; run the checks explicitly.
          gh workflow run decx-kuna.yml --ref "$branch"
