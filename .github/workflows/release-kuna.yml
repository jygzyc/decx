# Purpose: publish the fallback release assets the kuna manifest installs from
# this repository when the upstream release is unavailable or unverifiable.
#
# The preferred source is UPSTREAM'S OWN RELEASE: the mirror job downloads
# Noelo-Lab/kuna's v{version} assets and repacks every one of them as a zip.
# Only when that release cannot be fetched (network, deleted tag, renamed
# asset) does this workflow fall back to building the pinned submodule
# checkout, adapted from upstream's own release pipeline
# (subprojects/decx-kuna/source/.github/workflows/release.yml): same build
# matrix (its five targets), same `make specs` for the platform-independent
# SLEIGH tree, same KUNA_VERSION baking so `kuna --version` reports the
# release.
#
# Either way the published assets are zips whose names follow the manifest's
# fallbackRelease contract (subprojects/decx-kuna/decx-kuna.json) verbatim --
# the manager reads those names, so they are not up for design:
#   kuna-v{version}-linux-x86_64.zip    kuna-v{version}-macos-arm64.zip
#   kuna-v{version}-linux-arm64.zip     kuna-v{version}-windows-x86_64.zip
#   kuna-v{version}-macos-x86_64.zip    (kuna, decomp_dbg, slacomp)
#   kuna-v{version}-specs.zip           compiled specs/ (platform-independent)
#   kuna-SHA256SUMS.txt                 sha256 of every published asset
# Upstream ships no windows-arm64 build, so neither does this fallback -- the
# manager reports that platform as unsupported instead of inventing an asset.
on:
  push:
    tags: ['kuna-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. kuna-v1.515
        required: true

permissions:
  contents: read

concurrency:
  group: release-kuna-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate the tag against the pin
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      pinned: ${{ steps.meta.outputs.pinned }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          # Upstream's minor version is a commit count over full history; the
          # submodule carries its own tags, so `git describe` resolves the
          # pinned release (v1.515 -> 1.515).
          fetch-depth: 0

      - id: meta
        run: |
          set -eu
          # The checkout action may clone the submodule shallowly; the release
          # tag on the pinned commit must be resolvable, so fetch it fully.
          git -C subprojects/decx-kuna/source fetch --tags --force origin 2>/dev/null || \
            git -C subprojects/decx-kuna/source fetch --unshallow --tags origin 2>/dev/null || true
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          case "$tag" in
            kuna-v*) version="${tag#kuna-v}" ;;
            *) echo "::error::tag '$tag' must look like kuna-v<major.minor>"; exit 1 ;;
          esac
          # Kuna versions are MAJOR.MINOR (scripts/version.sh); that shape is
          # what `kuna --version` reports and what the manifest pins.
          case "$version" in
            ''|*.*.*|*[!0-9.]*)
              echo "::error::tag version '$version' must look like 1.515"
              exit 1 ;;
          esac
          pinned="$(bash .github/scripts/pinned-gitlink.sh subprojects/decx-kuna/source)"
          echo "pinned gitlink: $pinned"
          actual="$(git -C subprojects/decx-kuna/source rev-parse HEAD)"
          if [ "$actual" != "$pinned" ]; then
            echo "::error::submodule checkout $actual does not match the pinned gitlink $pinned"
            exit 1
          fi
          described="$(git -C subprojects/decx-kuna/source describe --tags --exact-match "$pinned" 2>/dev/null || true)"
          echo "pinned tag: ${described:-<none>}"
          if [ "$described" != "v$version" ]; then
            echo "::error::tag version '$version' does not match the pinned checkout tag '${described:-<none>}'"
            echo "::error::re-tag to match the pin, or move the submodule pin to the v$version commit"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "pinned=$pinned"
          } >> "$GITHUB_OUTPUT"

  # Preferred path: mirror upstream's release. A missing or unreachable
  # upstream release is NOT a failure here -- it selects the source-build legs.
  mirror:
    name: Fetch upstream's release assets
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.fetch.outputs.ok }}
    steps:
      - id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -u
          mkdir -p upstream
          ok=true
          gh release download "v$VERSION" --repo Noelo-Lab/kuna --dir upstream --clobber \
            --pattern "kuna-v$VERSION-linux-x86_64.tar.gz" \
            --pattern "kuna-v$VERSION-linux-arm64.tar.gz" \
            --pattern "kuna-v$VERSION-macos-x86_64.tar.gz" \
            --pattern "kuna-v$VERSION-macos-arm64.tar.gz" \
            --pattern "kuna-v$VERSION-windows-x86_64.zip" \
            --pattern "kuna-v$VERSION-specs.tar.gz" || ok=false
          for suffix in linux-x86_64.tar.gz linux-arm64.tar.gz macos-x86_64.tar.gz macos-arm64.tar.gz windows-x86_64.zip specs.tar.gz; do
            if [ ! -s "upstream/kuna-v$VERSION-$suffix" ]; then
              echo "upstream asset missing: kuna-v$VERSION-$suffix"
              ok=false
            fi
          done
          echo "mirror ok=$ok"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.1
        if: steps.fetch.outputs.ok == 'true'
        with:
          name: kuna-upstream
          path: upstream/*
          if-no-files-found: error

  # Every asset becomes a zip, whatever upstream's own container was; the
  # manifest's fallbackRelease names .zip for all six.
  repack:
    name: Repack upstream assets as zip
    needs: [validate, mirror]
    if: needs.mirror.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kuna-upstream
          path: upstream

      - name: Repack to zip and write checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          repack() {
            src="$1"
            out="$2"
            tmp="$(mktemp -d)"
            case "$src" in
              *.zip) unzip -q "$src" -d "$tmp" ;;
              *) tar xzf "$src" -C "$tmp" ;;
            esac
            (cd "$tmp" && zip -q -r - .) > "$out"
            rm -rf "$tmp"
          }
          for platform in linux-x86_64 linux-arm64 macos-x86_64 macos-arm64 windows-x86_64; do
            src="upstream/kuna-v$VERSION-$platform.tar.gz"
            if [ "$platform" = "windows-x86_64" ]; then
              src="upstream/kuna-v$VERSION-$platform.zip"
            fi
            repack "$src" "dist/kuna-v$VERSION-$platform.zip"
          done
          repack "upstream/kuna-v$VERSION-specs.tar.gz" "dist/kuna-v$VERSION-specs.zip"
          # Sanity: every platform zip carries the binaries, the specs zip
          # carries compiled .sla files.
          for platform in linux-x86_64 linux-arm64 macos-x86_64 macos-arm64; do
            unzip -Z1 "dist/kuna-v$VERSION-$platform.zip" | grep -q 'kuna$'
          done
          unzip -Z1 "dist/kuna-v$VERSION-windows-x86_64.zip" | grep -q 'kuna.exe$'
          test "$(unzip -Z1 "dist/kuna-v$VERSION-specs.zip" | grep -c '\.sla$')" -gt 0
          : > dist/kuna-SHA256SUMS.txt
          for asset in dist/*.zip; do
            (cd dist && sha256sum "$(basename "$asset")") >> dist/kuna-SHA256SUMS.txt
          done
          cat dist/kuna-SHA256SUMS.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kuna-fallback
          path: dist/*
          if-no-files-found: error

  # Fallback path: build the pinned submodule checkout. Runs only when the
  # upstream release could not be mirrored.
  build:
    name: ${{ matrix.platform }} (from source)
    needs: [validate, mirror]
    if: needs.mirror.outputs.ok != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Upstream's five-target matrix (release.yml); the platform keys are
          # the manifest's. Upstream has no windows-arm64 target and neither
          # does this workflow.
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      # Baked into `kuna --version` via option_env! in kuna-cli, exactly as
      # upstream's release job does.
      KUNA_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: The submodule is at the pin
        run: |
          test "$(git -C subprojects/decx-kuna/source rev-parse HEAD)" = "${{ needs.validate.outputs.pinned }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subprojects/decx-kuna/source/decompiler
          key: ${{ matrix.target }}

      # Upstream builds kuna-cli, kuna-console (decomp_dbg), kuna-slacomp and
      # kuna-ghidra in one shot; the fallback archive only ships the three
      # user-facing binaries the manifest declares (the Ghidra extension is
      # upstream-release territory, not an install fallback).
      - name: Build the pinned source
        working-directory: subprojects/decx-kuna/source/decompiler
        run: cargo build --release --locked --target ${{ matrix.target }} -p kuna-cli -p kuna-console -p kuna-slacomp

      # x86_64-apple-darwin is cross-compiled on the arm64 runner and cannot
      # execute here; every other leg smokes natively.
      - name: Smoke (kuna --version reports the release)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          bin="subprojects/decx-kuna/source/decompiler/target/${{ matrix.target }}/release/kuna$ext"
          out="$("$bin" --version)"
          echo "$out"
          [ "$out" = "kuna ${{ needs.validate.outputs.version }}" ]

      - name: Package the archive
        shell: bash
        run: |
          set -eu
          version="${{ needs.validate.outputs.version }}"
          bindir="subprojects/decx-kuna/source/decompiler/target/${{ matrix.target }}/release"
          # The asset name is the manifest's fallbackRelease contract exactly:
          # kuna-v{version}-{asset-suffix}.zip, suffix = matrix.name (upstream's
          # macos-x86_64 / linux-x86_64 / windows-x86_64 naming, NOT the
          # manifest's macos-x64 lookup key).
          pkg="kuna-v$version-${{ matrix.name }}"
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p "dist/$pkg"
          cp "$bindir/kuna$ext" "$bindir/decomp_dbg$ext" "$bindir/slacomp$ext" "dist/$pkg/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a "$pkg.zip" "$pkg" > /dev/null)
          else
            (cd dist && zip -q -r "$pkg.zip" "$pkg")
          fi
          rm -r "dist/$pkg"
          ls -l dist

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kuna-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  specs:
    name: Compiled SLEIGH specs (from source)
    needs: [validate, mirror]
    if: needs.mirror.outputs.ok != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subprojects/decx-kuna/source/decompiler

      # Upstream's own step: build slacomp, then compile every vendored
      # .slaspec to .sla inside specs/. The tree is platform-independent, so
      # one asset serves every OS.
      - name: Compile every .slaspec -> .sla
        working-directory: subprojects/decx-kuna/source
        run: make specs

      - name: Package the specs tree
        run: |
          set -eu
          version="${{ needs.validate.outputs.version }}"
          sla_count="$(find subprojects/decx-kuna/source/specs -name '*.sla' | wc -l | tr -d ' ')"
          echo "$sla_count compiled .sla files"
          test "$sla_count" -gt 0
          mkdir -p dist
          (cd subprojects/decx-kuna/source && zip -q -r "$GITHUB_WORKSPACE/dist/kuna-v$version-specs.zip" specs)

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kuna-specs
          path: dist/*
          if-no-files-found: error

  # Merge the source-build legs into the same artifact the repack leg would
  # have produced, so publish has exactly one input either way.
  collect:
    name: Checksums for the source build
    needs: [validate, mirror, build, specs]
    if: needs.mirror.outputs.ok != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kuna-*
          path: dist
          merge-multiple: true

      - name: Verify the asset set and write checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          expected="kuna-v$VERSION-linux-x86_64.zip kuna-v$VERSION-linux-arm64.zip kuna-v$VERSION-macos-x86_64.zip kuna-v$VERSION-macos-arm64.zip kuna-v$VERSION-windows-x86_64.zip kuna-v$VERSION-specs.zip"
          for asset in $expected; do
            if [ ! -f "$asset" ]; then
              echo "::error::missing release asset $asset"
              exit 1
            fi
          done
          : > kuna-SHA256SUMS.txt
          for asset in $expected; do
            sha256sum "$asset" >> kuna-SHA256SUMS.txt
          done
          cat kuna-SHA256SUMS.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kuna-fallback
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.validate.outputs.tag }}
    needs: [validate, mirror, repack, collect]
    if: always() && needs.validate.result == 'success' && (needs.repack.result == 'success' || needs.collect.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kuna-fallback
          path: dist

      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PINNED: ${{ needs.validate.outputs.pinned }}
          MIRRORED: ${{ needs.mirror.outputs.ok }}
        run: |
          set -eu
          if [ "$MIRRORED" = "true" ]; then
            origin="a repack of upstream's own release assets (https://github.com/Noelo-Lab/kuna/releases/tag/v$VERSION), rezipped without modification to the payload"
          else
            origin="built from the pinned submodule \`subprojects/decx-kuna/source\` at \`$PINNED\` because upstream's release could not be fetched"
          fi
          notes="$(printf 'Kuna %s fallback release -- %s.\n\nEvery asset is a zip shipping \`kuna\` (the CLI), \`decomp_dbg\` (the decompiler console) and \`slacomp\` (the SLEIGH compiler); the specs zip holds the compiled SLEIGH tree. \`decx install kuna\` downloads and extracts both and points \`KUNA_SPECS\` at the result.\n\nNo windows-arm64 asset: upstream Kuna does not build one, so the manager reports that platform as unsupported instead of substituting an emulation.' "$VERSION" "$origin")"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber ./*
          else
            gh release create "$TAG" --title "$TAG" --notes "$notes" ./*
          fi
