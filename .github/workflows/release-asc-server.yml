name: Release asc-server

on:
  push:
    tags:
      - 'asc-server-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Verify tag matches VERSION file
      run: |
        TAG_VERSION="${GITHUB_REF_NAME##*-v}"
        FILE_VERSION="$(tr -d '[:space:]' < modules/decx-asc/VERSION)"
        echo "tag version: $TAG_VERSION"
        echo "VERSION file: $FILE_VERSION"
        if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
          echo "::error::Tag '${GITHUB_REF_NAME}' does not match modules/decx-asc/VERSION '${FILE_VERSION}'. Update the VERSION file and re-tag."
          exit 1
        fi

    - name: Set version
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME##*-v}"
        echo "value=$VERSION" >> $GITHUB_OUTPUT
        # Versions with a prerelease suffix (e.g. 0.2.0-beta.1) publish as GitHub prereleases.
        case "$VERSION" in
          *-*) echo "prerelease=true" >> $GITHUB_OUTPUT ;;
          *)   echo "prerelease=false" >> $GITHUB_OUTPUT ;;
        esac

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Build asc-server archive
      run: ./build.sh
      working-directory: modules/decx-asc

    - name: Verify release artifacts
      run: |
        VERSION="${{ steps.version.outputs.value }}"
        ZIP="modules/decx-asc/dist/asc-server-$VERSION.zip"
        test -f "$ZIP"
        unzip -l "$ZIP"
        unzip -Z1 "$ZIP" | grep -qx 'decx.json'
        unzip -Z1 "$ZIP" | grep -qx 'VERSION'

    - name: Generate checksums
      run: |
        cd modules/decx-asc/dist
        rm -f SHA256SUMS
        sha256sum *.zip > SHA256SUMS
        cat SHA256SUMS

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: |
          modules/decx-asc/dist/asc-server-*.zip
          modules/decx-asc/dist/SHA256SUMS
        draft: false
        prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
