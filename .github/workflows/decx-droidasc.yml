name: DroidASC

# DroidASC is published to PyPI. DECX creates the private venv and runs the
# manifest's pip install command; no release archive or packaging script is
# needed. Keep the pinned checkout for upstream reference, not installation.
on:
  push:
    branches: ['**']
    tags: ['droidasc-v*']
    paths: ['subprojects/decx-droidasc/**', 'decx/**', 'skills/decx-tool/**', '.github/workflows/decx-droidasc.yml']
  pull_request:
    paths: ['subprojects/decx-droidasc/**', 'decx/**', 'skills/decx-tool/**', '.github/workflows/decx-droidasc.yml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: PyPI install (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-14
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    defaults:
      run:
        shell: bash
    steps:
      - name: Set temporary install home
        shell: bash
        run: echo "DECX_HOME=$RUNNER_TEMP/decx-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install from PyPI with DECX
        run: node decx/src/cli.ts install droidasc --home "$DECX_HOME" --no-links --pretty

      - name: Build the manager
        run: npm ci --prefix decx && npm --prefix decx run build

      - name: Decompile a real APK and verify Java, manifest and references
        run: npm --prefix decx run test:functional:droidasc

      - name: PROVENANCE records the PyPI package and version
        run: |
          grep -q '^install_command: pip install droidasc$' "$DECX_HOME/share/droidasc/PROVENANCE"
          grep -Eq '^version: [0-9]' "$DECX_HOME/share/droidasc/PROVENANCE"
