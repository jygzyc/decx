name: Release ard-framework plugin

on:
  push:
    tags:
      - 'ard-framework-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Verify tag matches VERSION file
      run: |
        TAG_VERSION="${GITHUB_REF_NAME##*-v}"
        FILE_VERSION="$(tr -d '[:space:]' < plugins/ard-framework/VERSION)"
        echo "tag version: $TAG_VERSION"
        echo "VERSION file: $FILE_VERSION"
        if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
          echo "::error::Tag '${GITHUB_REF_NAME}' does not match plugins/ard-framework/VERSION '${FILE_VERSION}'. Update the VERSION file and re-tag."
          exit 1
        fi

    - name: Set version
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME##*-v}"
        echo "value=$VERSION" >> $GITHUB_OUTPUT
        # Versions with a prerelease suffix (e.g. 4.3.0-beta.1) publish as GitHub prereleases.
        case "$VERSION" in
          *-*) echo "prerelease=true" >> $GITHUB_OUTPUT ;;
          *)   echo "prerelease=false" >> $GITHUB_OUTPUT ;;
        esac

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Build framework plugin bundle
      run: |
        npm ci --no-audit --no-fund
        npm run build
      working-directory: plugins/ard-framework

    # Plugin bundles are platform independent: the CLI installs this archive into
    # DECX_HOME/plugins/<id> and evaluates dist/ard-framework.js in-process.
    - name: Pack framework plugin bundle
      run: |
        VERSION="${{ steps.version.outputs.value }}"
        rm -rf dist/framework-plugin
        mkdir -p dist/framework-plugin/dist
        cp plugins/ard-framework/dist/ard-framework.js dist/framework-plugin/dist/
        cp plugins/ard-framework/README.md dist/framework-plugin/
        cp plugins/ard-framework/decx.json dist/framework-plugin/
        cp plugins/ard-framework/VERSION dist/framework-plugin/
        (cd dist/framework-plugin && zip -X -r "$GITHUB_WORKSPACE/dist/decx-ard-framework-plugin-$VERSION.zip" .)
        unzip -l "dist/decx-ard-framework-plugin-$VERSION.zip"

    - name: Verify release artifacts
      run: |
        VERSION="${{ steps.version.outputs.value }}"
        ZIP="dist/decx-ard-framework-plugin-$VERSION.zip"
        test -f "$ZIP"
        unzip -Z1 "$ZIP" | grep -qx 'decx.json'
        unzip -Z1 "$ZIP" | grep -qx 'VERSION'

    - name: Generate checksums
      run: |
        (cd dist && rm -f SHA256SUMS && sha256sum *.zip > SHA256SUMS)
        cat dist/SHA256SUMS

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: |
          dist/decx-ard-framework-plugin-*.zip
          dist/SHA256SUMS
        draft: false
        prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
