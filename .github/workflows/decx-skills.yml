name: DECX skills

on:
  push:
    branches: ['**']
    paths: ['.agents/skills/**', 'scripts/check-skills.py', 'scripts/test_check_skills.py', '.github/workflows/decx-skills.yml']
  pull_request:
    paths: ['.agents/skills/**', 'scripts/check-skills.py', 'scripts/test_check_skills.py', '.github/workflows/decx-skills.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python scripts/check-skills.py
      - run: python -m unittest discover -s scripts -p 'test_check_skills.py'
