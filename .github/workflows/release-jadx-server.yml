name: Release jadx-server

on:
  push:
    tags:
      - 'jadx-server-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Verify tag matches VERSION file
      run: |
        TAG_VERSION="${GITHUB_REF_NAME##*-v}"
        FILE_VERSION="$(tr -d '[:space:]' < modules/decx-jadx/VERSION)"
        echo "tag version: $TAG_VERSION"
        echo "VERSION file: $FILE_VERSION"
        if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
          echo "::error::Tag '${GITHUB_REF_NAME}' does not match modules/decx-jadx/VERSION '${FILE_VERSION}'. Update the VERSION file and re-tag."
          exit 1
        fi

    - name: Set version
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME##*-v}"
        echo "value=$VERSION" >> $GITHUB_OUTPUT
        # Versions with a prerelease suffix (e.g. 4.3.0-beta.1) publish as GitHub prereleases.
        case "$VERSION" in
          *-*) echo "prerelease=true" >> $GITHUB_OUTPUT ;;
          *)   echo "prerelease=false" >> $GITHUB_OUTPUT ;;
        esac

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0

    - name: Build with Gradle
      run: ./gradlew test dist
      working-directory: modules/decx-jadx

    # The zip installs as an archive (decx.json + VERSION + the server jar at the
    # archive root); the plain jars stay separate assets as before.
    - name: Pack jadx-server archive
      run: |
        VERSION="${{ steps.version.outputs.value }}"
        rm -rf dist/jadx-server
        mkdir -p dist/jadx-server
        cp "modules/decx-jadx/build/dist/jadx-server-$VERSION.jar" dist/jadx-server/jadx-server.jar
        cp modules/decx-jadx/decx.json dist/jadx-server/
        cp modules/decx-jadx/VERSION dist/jadx-server/
        (cd dist/jadx-server && zip -X -r "$GITHUB_WORKSPACE/dist/jadx-server-$VERSION.zip" decx.json VERSION jadx-server.jar)
        unzip -l "dist/jadx-server-$VERSION.zip"

    - name: Collect release assets
      run: |
        VERSION="${{ steps.version.outputs.value }}"
        test -f "modules/decx-jadx/build/dist/jadx_decx_plugin-$VERSION.jar"
        test -f "modules/decx-jadx/build/dist/jadx-server-$VERSION.jar"
        test -f "dist/jadx-server-$VERSION.zip"
        cp "modules/decx-jadx/build/dist/jadx-server-$VERSION.jar" dist/
        cp "modules/decx-jadx/build/dist/jadx_decx_plugin-$VERSION.jar" dist/

    - name: Generate checksums
      run: |
        (cd dist && rm -f SHA256SUMS && sha256sum *.zip *.jar > SHA256SUMS)
        cat dist/SHA256SUMS

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: |
          dist/*.zip
          dist/*.jar
          dist/SHA256SUMS
        draft: false
        prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
