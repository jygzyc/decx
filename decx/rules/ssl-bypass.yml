id: ssl_bypass
name: "SSL Certificate Validation Bypass"
description: "Custom TrustManager/HostnameVerifier bypasses certificate validation"
severity: high
trace_depth: 5
source:
  param:
    "<javax.net.ssl.X509TrustManager: void checkServerTrusted(java.security.cert.X509Certificate[],java.lang.String)>": ["p0"]
sink:
  "<javax.net.ssl.SSLContext: void init(javax.net.ssl.KeyManager[],javax.net.ssl.TrustManager[],java.security.SecureRandom)>":
    taint_check: ["p1"]
