# Investigation rule: ZIP Slip (directory traversal via archive extraction)
# Collects evidence for path traversal vulnerabilities in ZIP/archive extraction
# code. The engine traces the extracted entry name's flow to file I/O;
# the AI determines if the path is insufficiently sanitized.
id: zip_slip
description: "Collect evidence for ZIP slip / directory traversal in archive extraction"
category: path_traversal

targets:
  - kind: method
    signature: "<java.util.zip.ZipFile: java.util.Enumeration entries()>"
  - kind: method
    signature: "<java.util.zip.ZipInputStream: java.util.zip.ZipEntry getNextEntry()>"

collect:
  - kind: callers
    include_callees: true
  - kind: variable_flow
    variable: return
    depth: 8

context: []
