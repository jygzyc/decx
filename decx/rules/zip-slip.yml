# ZIP Slip: archive entry name to file path construction
id: zip_slip
name: "ZIP Slip"
description: "Detect ZIP slip / directory traversal via archive extraction where entry name reaches file path"
severity: high
category: path_traversal
trace_depth: 8
source:
  - kind: return
    method: "<java.util.zip.ZipInputStream: java.util.zip.ZipEntry getNextEntry()>"
sink:
  - method: "<java.io.File: void <init>(java.lang.String)>"
    taint_check: ["p0"]
  - method: "<java.io.FileOutputStream: void <init>(java.lang.String)>"
    taint_check: ["p0"]
