# Dynamic Receiver Abuse: sensitive data sent via dynamic broadcast
id: dynamic_receiver_abuse
name: "Dynamic Receiver Data Leak"
description: "Detect sensitive data (e.g. IMEI, serial) sent through dynamically registered broadcast receivers"
severity: medium
category: data_leak
trace_depth: 12
source:
  - kind: return
    method: "<android.telephony.TelephonyManager: java.lang.String getDeviceId()>"
  - kind: return
    method: "<android.os.Build: java.lang.String getSerial()>"
  - kind: field
    method: "<android.os.Build: java.lang.String SERIAL>"
sink:
  - method: "<android.content.Context: void sendBroadcast(android.content.Intent)>"
    taint_check: ["p0"]
  - method: "<android.content.Context: void sendBroadcast(android.content.Intent,java.lang.String)>"
    taint_check: ["p0"]
