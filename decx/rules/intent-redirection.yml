# Investigation rule: Intent Redirection
# Collects evidence for potential intent redirection vulnerabilities.
# The engine gathers callers, variable flow, and ICC targets;
# the AI determines if a real vulnerability exists.
id: intent_redirection
description: "Collect evidence for potential intent redirection via Parcelable extras"
category: intent_redirection
target_sdk: "26:34"

targets:
  - kind: method
    signature: "<android.os.BaseBundle: android.os.Parcelable getParcelable(java.lang.String)>"

collect:
  - kind: callers
    include_callees: false
  - kind: variable_flow
    variable: return
    depth: 10
  - kind: icc_targets
    from_callers_of: "<android.app.Activity: void startActivity(android.content.Intent)>"

context:
  - kind: dynamic_receivers
  - kind: callbacks
    component: exported
