id: intent_redirection
name: "Intent Redirection"
description: "Untrusted Intent (from getIntent/getParcelableExtra) flows to startActivity/sendBroadcast"
severity: high
trace_depth: 6
source:
  return:
    - "<android.app.Activity: android.content.Intent getIntent()>"
    - "<android.content.Intent: android.os.Parcelable getParcelableExtra(java.lang.String)>"
    - "<android.os.Bundle: android.os.Parcelable getParcelable(java.lang.String)>"
sink:
  "<android.app.Activity: void startActivity(android.content.Intent)>":
    taint_check: ["p0"]
  "<android.app.Activity: void startActivityForResult(android.content.Intent,int)>":
    taint_check: ["p0"]
  "<android.content.Context: void sendBroadcast(android.content.Intent)>":
    taint_check: ["p0"]
