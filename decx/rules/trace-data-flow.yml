# Trace Data Flow: generic parameterized rule for AI-driven custom analysis
# AI provides source_method and sink_method parameters to trace any data flow
id: trace_data_flow
name: "Trace Data Flow"
description: "Trace data from a source method's return value to a sink method's parameter. Provide source_method and sink_method as parameters."
severity: medium
category: general
trace_depth: 10
parameters:
  - name: source_method
    type: method_signature
    description: "Method whose return value is the taint source (Tai-e signature format: <Class: Type name(args)>)"
    required: true
  - name: sink_method
    type: method_signature
    description: "Method where tainted data reaches (Tai-e signature format)"
    required: true
  - name: sink_position
    type: taint_position
    description: "Argument position at sink: p0, p1, p*, @this, return"
    required: false
    defaultValue: "p*"
source:
  - kind: return
    method: "{{source_method}}"
sink:
  - method: "{{sink_method}}"
    taint_check: ["{{sink_position}}"]
