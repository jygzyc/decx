# Path Traversal: ContentProvider.openFile file path to file I/O
id: path_traversal
name: "Path Traversal in ContentProvider"
description: "Detect path traversal in ContentProvider.openFile where user input reaches file operations"
severity: high
category: path_traversal
trace_depth: 8
source:
  - kind: param
    method: "<android.content.ContentProvider: android.os.ParcelFileDescriptor openFile(android.net.Uri,java.lang.String)>"
    position: "p0"
sink:
  - method: "<java.io.File: void <init>(java.lang.String)>"
    taint_check: ["p0"]
  - method: "<java.io.FileOutputStream: void <init>(java.lang.String)>"
    taint_check: ["p0"]
  - method: "<java.io.FileInputStream: void <init>(java.lang.String)>"
    taint_check: ["p0"]
