[versions]
kotlin = "2.4.10"
jadx = "1.5.6"
gson = "2.14.0"
javalin = "7.2.2"
ktor = "3.5.2"
mcpKotlinSdk = "0.15.0"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
jackson = "2.22.1"
slf4j = "2.0.18"
logback = "1.6.2"
jadxScriptKotlin = "1.1.2"
kotlinScripting = "2.4.10"
ktlint = "1.8.0"
kotlinLogging = "8.0.4"
assertj = "3.27.7"
junit = "6.1.3"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
use-latest-versions = { id = "se.patrikerdes.use-latest-versions", version = "0.2.19" }
ben-manes-versions = { id = "com.github.ben-manes.versions", version = "0.61.0" }

[libraries]
jadx-core = { group = "io.github.skylot", name = "jadx-core", version.ref = "jadx" }
jadx-gui = { group = "io.github.skylot", name = "jadx-gui", version.ref = "jadx" }
jadx-cli = { group = "io.github.skylot", name = "jadx-cli", version.ref = "jadx" }
jadx-smali-input = { group = "io.github.skylot", name = "jadx-smali-input", version.ref = "jadx" }
jadx-dex-input = { group = "io.github.skylot", name = "jadx-dex-input", version.ref = "jadx" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlin-scripting-jvm-host = { group = "org.jetbrains.kotlin", name = "kotlin-scripting-jvm-host", version.ref = "kotlinScripting" }
kotlin-scripting-ide-services = { group = "org.jetbrains.kotlin", name = "kotlin-scripting-ide-services", version.ref = "kotlinScripting" }
kotlin-scripting-compiler-embeddable = { group = "org.jetbrains.kotlin", name = "kotlin-scripting-compiler-embeddable", version.ref = "kotlinScripting" }
kotlin-scripting-dependencies = { group = "org.jetbrains.kotlin", name = "kotlin-scripting-dependencies", version.ref = "kotlinScripting" }
kotlin-scripting-dependencies-maven = { group = "org.jetbrains.kotlin", name = "kotlin-scripting-dependencies-maven", version.ref = "kotlinScripting" }
kotlin-compiler-embeddable = { group = "org.jetbrains.kotlin", name = "kotlin-compiler-embeddable", version.ref = "kotlinScripting" }
ktlint-rule-engine = { group = "com.pinterest.ktlint", name = "ktlint-rule-engine", version.ref = "ktlint" }
ktlint-ruleset-standard = { group = "com.pinterest.ktlint", name = "ktlint-ruleset-standard", version.ref = "ktlint" }
kotlin-logging-jvm = { group = "io.github.oshai", name = "kotlin-logging-jvm", version.ref = "kotlinLogging" }
kotlinx-coroutines-bom = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-bom", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-bom = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-bom", version.ref = "kotlinxSerialization" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
javalin = { group = "io.javalin", name = "javalin", version.ref = "javalin" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
mcp-kotlin-sdk-server = { group = "io.modelcontextprotocol", name = "kotlin-sdk-server", version.ref = "mcpKotlinSdk" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
