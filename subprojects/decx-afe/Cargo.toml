[package]
name = "afe"
version = "0.1.0"
edition = "2021"
description = "Android Framework Extract: collect, process and pack Android framework artifacts"
license = "Apache-2.0"

[[bin]]
name = "afe"
path = "src/main.rs"

[lib]
name = "afe"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
