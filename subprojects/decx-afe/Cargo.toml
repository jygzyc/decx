[package]
name = "afe"
version = "0.1.0"
edition = "2021"
description = "Android Framework Extract: collect, process and pack Android framework artifacts"
license = "Apache-2.0"

[[bin]]
name = "afe"
path = "src/main.rs"

[lib]
name = "afe"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
