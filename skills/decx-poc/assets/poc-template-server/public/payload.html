<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PoC Payload</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f7f3ec;
            color: #221b14;
            font-family: system-ui, sans-serif;
        }
        main {
            max-width: 860px;
            margin: 0 auto;
            display: grid;
            gap: 14px;
        }
        section {
            border: 1px solid #dccfbe;
            border-radius: 12px;
            background: #fffaf2;
            padding: 16px;
        }
        h1, h2 { margin: 0 0 8px; }
        p { color: #6c6256; margin: 4px 0; }
        pre {
            margin: 0;
            padding: 12px;
            border-radius: 10px;
            background: #201914;
            color: #f9efe4;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: "SFMono-Regular", "Menlo", "Consolas", monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
<main>
    <section>
        <h1>Hosted Payload</h1>
        <p>Attacker-controlled HTML loaded by the victim WebView. Add one script block per active PoC.</p>
    </section>

    <section>
        <h2>Context</h2>
        <pre id="context">Loading...</pre>
    </section>

    <section>
        <h2>Payload Log</h2>
        <pre id="log">Ready.</pre>
    </section>
</main>

<script>
const contextEl = document.getElementById("context");
const logEl = document.getElementById("log");

function log(message) {
  logEl.textContent += `\n${message}`;
}

contextEl.textContent =
  `Origin: ${location.origin}\n` +
  `Href: ${location.href}\n` +
  `User-Agent: ${navigator.userAgent || "(unknown)"}`;
</script>

<script>
// Replace this block with the active target payload.
// Examples: bridge call, cookie probe, intent:// redirect, fetch exfiltration.
log("[Template] Replace this script block with the active PoC payload.");
</script>
</body>
</html>
